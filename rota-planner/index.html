<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rota Planner</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#e1e4e9; --border-strong:#c7cbd3;
    --text:#1c2026; --text-dim:#6b7280; --accent:#2563eb; --accent-dim:#dbe6fd;
    --chip:#eef2ff; --chip-border:#c7d2fe; --chip-text:#1e3a8a;
    --danger:#dc2626; --danger-bg:#fee2e2; --warn-bg:#fff7ed; --warn-border:#fdba74;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:40px}
  header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);
    padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header.top h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
  .spacer{flex:1}
  button, .btn{
    font:inherit;cursor:pointer;border:1px solid var(--border-strong);background:var(--panel);
    color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:background .1s;
  }
  button:hover{background:#f0f1f3}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1d4ed8}
  button.ghost{border-color:transparent;background:transparent}
  button.danger{color:var(--danger);border-color:#fca5a5}
  button.danger:hover{background:var(--danger-bg)}
  button:disabled{opacity:.45;cursor:not-allowed}
  /* Visually hidden, but NOT display:none — iOS Safari refuses to open the picker
     for a display:none file input. It is triggered via fileInput.click() in JS. */
  input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  main{max-width:1400px;margin:0 auto;padding:16px}

  .roster-status{font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .roster-status b{color:var(--text)}

  .empty-state{background:var(--panel);border:1px dashed var(--border-strong);border-radius:var(--radius);
    padding:48px 24px;text-align:center;color:var(--text-dim);margin-top:24px}
  .empty-state h2{color:var(--text);margin:0 0 8px}
  .empty-state .btn{margin-top:16px}

  .warning-banner{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:8px;
    padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
  .ok-banner{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;border-radius:8px;
    padding:10px 14px;font-size:13px;margin-bottom:14px}

  .daytabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;
    border-bottom:1px solid var(--border)}
  .daytab{flex:none;padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;
    color:var(--text-dim);cursor:pointer;border:1px solid transparent;border-bottom:none;white-space:nowrap}
  .daytab .n{display:block;font-size:11px;font-weight:500;opacity:.8}
  .daytab.active{color:var(--accent);background:var(--panel);border-color:var(--border);
    box-shadow:0 -1px 0 var(--panel)}
  .daytab .count{display:inline-block;margin-left:4px;background:var(--accent-dim);color:var(--accent);
    border-radius:10px;padding:0 6px;font-size:11px}

  section.pool{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px}
  section.pool h3{margin:0 0 10px;font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:34px;max-height:168px;overflow-y:auto;padding-right:2px}
  .chip{background:var(--chip);border:1px solid var(--chip-border);color:var(--chip-text);
    border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:grab;user-select:none;
    display:flex;align-items:center;gap:6px;line-height:1.3}
  .chip .t{font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
  .chip.armed{outline:2px solid var(--accent);outline-offset:1px;background:#dbe6fd}
  .chip.dragging{opacity:.4}
  .pool-empty{color:var(--text-dim);font-size:12.5px;font-style:italic}

  .grid-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden}
  .grid-scroll{overflow-x:auto}
  .grid-inner{min-width:1180px}
  .ruler{display:flex;border-bottom:1px solid var(--border);height:34px}
  .ruler-label{width:160px;flex:none;border-right:1px solid var(--border);background:#fafbfc}
  .ruler-scale{position:relative;flex:1}
  /* Hours label the top line, half hours the one below, so an hour label and the
     half hour 30 minutes after it never compete for the same horizontal space. */
  .ruler .tick{position:absolute;top:0;bottom:0;font-size:10px;color:var(--text-dim);
    border-left:1px solid var(--border);padding-left:3px;white-space:nowrap}
  .ruler .tick.hour{color:var(--text);font-weight:600;border-left-color:var(--border-strong);padding-top:3px}
  .ruler .tick.half{font-size:9px;opacity:.7;padding-top:18px}
  /* The closing mark sits on the right edge, so its label hangs to the left of the line. */
  .ruler .tick.last{border-left:none;border-right:1px solid var(--border-strong);
    padding-left:0;padding-right:3px;transform:translateX(-100%)}
  .rows{}
  .row{display:flex;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row .label-cell{width:160px;flex:none;display:flex;align-items:center;gap:4px;padding:6px 8px;
    border-right:1px solid var(--border);background:#fafbfc}
  .row .label-cell input{border:1px solid transparent;background:transparent;font:inherit;font-size:12.5px;
    font-weight:600;color:var(--text);width:100%;padding:4px 6px;border-radius:6px}
  .row .label-cell input:hover,.row .label-cell input:focus{border-color:var(--border-strong);background:#fff;outline:none}
  .row .label-cell .del{flex:none;opacity:.4;font-size:16px;line-height:1;color:var(--text-dim);
    background:none;border:none;cursor:pointer;padding:2px 6px}
  .row:hover .del,.row .label-cell .del:hover{opacity:1}
  .track{position:relative;flex:1;min-height:52px;background:
      repeating-linear-gradient(to right, transparent 0, transparent calc(200%/31 - 1px), var(--border-strong) calc(200%/31 - 1px), var(--border-strong) calc(200%/31)),
      repeating-linear-gradient(to right, transparent 0, transparent calc(100%/31 - 1px), var(--border) calc(100%/31 - 1px), var(--border) calc(100%/31));
    }
  .track.dragover{background-color:var(--accent-dim)}
  /* Drop preview: shows the rostered hours the block will snap to, wherever you let go. */
  .drop-preview{position:absolute;top:4px;bottom:4px;border:2px dashed var(--accent);
    background:rgba(37,99,235,.12);border-radius:7px;pointer-events:none;
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
    color:#1e3a8a;font-variant-numeric:tabular-nums;overflow:hidden}
  .block{position:absolute;background:#eef2ff;border:1px solid var(--accent);
    border-radius:7px;padding:5px 8px;font-size:11.5px;font-weight:600;color:#1e3a8a;overflow:hidden;
    cursor:grab;display:flex;flex-direction:column;justify-content:center;line-height:1.25;min-width:26px}
  .block .tm{font-weight:500;opacity:.75;font-size:10.5px;font-variant-numeric:tabular-nums}
  .block.overlap{border-color:var(--danger);background:#fef2f2;color:#7f1d1d}
  .block .x{position:absolute;top:2px;right:3px;font-size:12px;line-height:1;color:inherit;opacity:.55;
    cursor:pointer;padding:2px}
  .block .x:hover{opacity:1}
  .addrow{padding:10px 12px}

  /* Headcount strip: one cell per half hour, aligned to the timeline columns. */
  .row.cov{background:#f6f8fb}
  .row.cov .label-cell{justify-content:flex-start}
  .cov-label{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;
    letter-spacing:.03em;padding-left:6px}
  .cov-scale{display:flex;flex:1;min-width:0}
  .cov-cell{flex:1 1 0;min-width:0;text-align:center;padding:5px 0;font-size:10px;font-weight:700;
    color:var(--text);border-left:1px solid var(--border);font-variant-numeric:tabular-nums}
  .cov-cell.onhour{border-left-color:var(--border-strong)}
  .cov-cell.zero{color:#b6bcc5;font-weight:500}
  .row.cov.total{background:#e9eef6;border-top:2px solid var(--border-strong)}
  .row.cov.total .cov-label{color:var(--text)}
  .row.cov.total .cov-cell{font-size:11.5px}
  .row.cov.total .cov-cell.zero{color:var(--danger);background:#fdeeee}

  .print-only{display:none}
  .print-title{font-size:15px;font-weight:700;margin:0 0 8px;
    padding-bottom:6px;border-bottom:2px solid #333}
  .print-title .pt-right{float:right;font-weight:500}

  /* One block per fitting room: a named header, then its numbered position rows. */
  .group-head{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#eaeef4;
    border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border)}
  .group:first-child .group-head{border-top:none}
  .group-head input{border:1px solid transparent;background:transparent;font:inherit;font-size:12.5px;
    font-weight:700;color:var(--text);padding:3px 6px;border-radius:6px;
    flex:0 1 auto;min-width:130px;max-width:300px}
  .group-head input:hover,.group-head input:focus{border-color:var(--border-strong);background:#fff;outline:none}
  .group-head .addpos{flex:none;padding:3px 9px;font-size:12px;border-color:var(--border-strong)}
  .group-head .del{flex:none;opacity:.45;font-size:17px;line-height:1;color:var(--text-dim);
    background:none;border:none;cursor:pointer;padding:2px 6px}
  .group-head .del:hover{opacity:1}

  .manual-form{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:16px;display:none;gap:10px;flex-wrap:wrap;align-items:end}
  .manual-form.open{display:flex}
  .manual-form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text-dim);font-weight:600}
  .manual-form input,.manual-form select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--border-strong);
    border-radius:6px;background:#fff}

  footer.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

  @media (max-width:700px){
    header.top h1{font-size:15px}
    main{padding:10px}
  }

  /* A 15.5-hour timeline needs the long edge of the paper. */
  @page{size:A4 landscape;margin:9mm}

  @media print{
    header.top,.pool,.manual-form,footer.actions,.daytabs,.addrow,.del,.x,
    .group-head button{display:none !important}
    .print-only{display:block !important}
    .ruler.print-only{display:flex !important}
    .ruler.ruler-top{display:none !important}   /* the per-room copies replace it */
    .ruler-repeat{height:22px;border-top:1px solid var(--border-strong)}
    .ruler-repeat .tick.half{display:none}      /* hours only, to keep it compact */
    .ruler-repeat .tick.hour{padding-top:5px}
    /* Gridlines are background gradients and block fills are background colours;
       without this the sheet prints as an empty frame. */
    body,.track,.block,.group-head,.row.cov,.cov-cell{
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* Screen greys are too faint on paper. */
    :root{--border:#a9afb8;--border-strong:#6f7680}
    body{padding:0;background:#fff}
    main{padding:0;max-width:none}
    .grid-wrap{border:1px solid var(--border-strong)}
    .grid-scroll{overflow:visible}
    .grid-inner{min-width:0}
    .group,.row{break-inside:avoid;page-break-inside:avoid}
    /* An unfilled position row still needs to be visible to write on, but not at the
       height of one holding a block. Only rows with nobody in them are compacted. */
    .track:empty{height:26px !important;min-height:26px}
    /* Shaving the chrome lets three rooms share a page instead of two. */
    .group-head{padding:3px 10px !important}
    .row.cov .cov-cell{padding:2px 0}
    .row .label-cell{padding:2px 8px}
    .group-head{background:#dfe4ea !important}
    .row.cov{background:#f0f3f7 !important}
    .row.cov.total{background:#dfe4ea !important}
    .block{background:#e8edfb !important;border-color:#1e3a8a !important}
    .ruler{border-bottom:1px solid var(--border-strong)}
  }
</style>
</head>
<body>

<header class="top">
  <h1>🗓️ Rota Planner</h1>
  <div class="roster-status" id="rosterStatus"></div>
  <div class="spacer"></div>
  <button class="ghost" id="btnCheck" title="Check the PDF imported completely">Check import</button>
  <button class="ghost" id="btnManual" title="Add a person by hand">+ Add person</button>
  <button id="btnPrint" title="Print current day">Print</button>
  <button class="primary" id="btnUpload">Upload PDF</button>
  <input type="file" id="fileInput" accept="application/pdf,.pdf">
</header>

<main>
  <div id="parseWarning"></div>
  <div id="manualForm" class="manual-form">
    <div style="flex-basis:100%;font-size:12px;color:var(--text-dim);margin-bottom:2px">
      Only for someone missing from the PDF. Everyone already imported has their hours fixed by the roster.
    </div>
    <label>Name<input type="text" id="mName" placeholder="Jane Doe"></label>
    <label>Day
      <select id="mDay"></select>
    </label>
    <label>Start<input type="time" id="mStart" value="09:00"></label>
    <label>End<input type="time" id="mEnd" value="17:00"></label>
    <button class="primary" id="mAdd">Add</button>
    <button class="ghost" id="mCancel">Cancel</button>
  </div>

  <div id="app"></div>
</main>

<script src="vendor/pdf.min.js"></script>
<script src="rota-parser.js"></script>
<script src="rota-app.js"></script>
</body>
</html>
