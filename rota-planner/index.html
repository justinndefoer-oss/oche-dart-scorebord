<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rota Planner</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#e1e4e9; --border-strong:#c7cbd3;
    --text:#1c2026; --text-dim:#6b7280; --accent:#2563eb; --accent-dim:#dbe6fd;
    --chip:#eef2ff; --chip-border:#c7d2fe; --chip-text:#1e3a8a;
    --danger:#dc2626; --danger-bg:#fee2e2; --warn-bg:#fff7ed; --warn-border:#fdba74;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:40px}
  header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);
    padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header.top h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
  .spacer{flex:1}
  button, .btn{
    font:inherit;cursor:pointer;border:1px solid var(--border-strong);background:var(--panel);
    color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:background .1s;
  }
  button:hover{background:#f0f1f3}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1d4ed8}
  button.ghost{border-color:transparent;background:transparent}
  button.danger{color:var(--danger);border-color:#fca5a5}
  button.danger:hover{background:var(--danger-bg)}
  button:disabled{opacity:.45;cursor:not-allowed}
  /* Visually hidden, but NOT display:none — iOS Safari refuses to open the picker
     for a display:none file input. It is triggered via fileInput.click() in JS. */
  input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  main{max-width:1400px;margin:0 auto;padding:16px}

  .roster-status{font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .roster-status b{color:var(--text)}

  .empty-state{background:var(--panel);border:1px dashed var(--border-strong);border-radius:var(--radius);
    padding:48px 24px;text-align:center;color:var(--text-dim);margin-top:24px}
  .empty-state h2{color:var(--text);margin:0 0 8px}
  .empty-state .btn{margin-top:16px}

  .warning-banner{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:8px;
    padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}

  .daytabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;
    border-bottom:1px solid var(--border)}
  .daytab{flex:none;padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;
    color:var(--text-dim);cursor:pointer;border:1px solid transparent;border-bottom:none;white-space:nowrap}
  .daytab .n{display:block;font-size:11px;font-weight:500;opacity:.8}
  .daytab.active{color:var(--accent);background:var(--panel);border-color:var(--border);
    box-shadow:0 -1px 0 var(--panel)}
  .daytab .count{display:inline-block;margin-left:4px;background:var(--accent-dim);color:var(--accent);
    border-radius:10px;padding:0 6px;font-size:11px}

  section.pool{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px}
  section.pool h3{margin:0 0 10px;font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:34px;max-height:168px;overflow-y:auto;padding-right:2px}
  .chip{background:var(--chip);border:1px solid var(--chip-border);color:var(--chip-text);
    border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:grab;user-select:none;
    display:flex;align-items:center;gap:6px;line-height:1.3}
  .chip .t{font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
  .chip.armed{outline:2px solid var(--accent);outline-offset:1px;background:#dbe6fd}
  .chip.dragging{opacity:.4}
  .pool-empty{color:var(--text-dim);font-size:12.5px;font-style:italic}

  .grid-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden}
  .grid-scroll{overflow-x:auto}
  .grid-inner{min-width:1180px}
  .ruler{display:flex;border-bottom:1px solid var(--border);padding-left:160px;position:relative;height:26px}
  .ruler .tick{position:absolute;top:0;bottom:0;font-size:10.5px;color:var(--text-dim);
    border-left:1px solid var(--border);padding-left:4px;padding-top:5px;white-space:nowrap}
  .rows{}
  .row{display:flex;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row .label-cell{width:160px;flex:none;display:flex;align-items:center;gap:4px;padding:6px 8px;
    border-right:1px solid var(--border);background:#fafbfc}
  .row .label-cell input{border:1px solid transparent;background:transparent;font:inherit;font-size:12.5px;
    font-weight:600;color:var(--text);width:100%;padding:4px 6px;border-radius:6px}
  .row .label-cell input:hover,.row .label-cell input:focus{border-color:var(--border-strong);background:#fff;outline:none}
  .row .label-cell .del{flex:none;opacity:0;font-size:15px;line-height:1;color:var(--text-dim);
    background:none;border:none;cursor:pointer;padding:2px 4px}
  .row:hover .del{opacity:1}
  .track{position:relative;flex:1;min-height:52px;background:
      repeating-linear-gradient(to right, transparent, transparent calc(100%/31 - 1px), var(--border) calc(100%/31 - 1px), var(--border) calc(100%/31));
    }
  .track.dragover{background-color:var(--accent-dim)}
  .block{position:absolute;background:#eef2ff;border:1px solid var(--accent);
    border-radius:7px;padding:5px 8px;font-size:11.5px;font-weight:600;color:#1e3a8a;overflow:hidden;
    cursor:grab;display:flex;flex-direction:column;justify-content:center;line-height:1.25;min-width:26px}
  .block .tm{font-weight:500;opacity:.75;font-size:10.5px;font-variant-numeric:tabular-nums}
  .block.overlap{border-color:var(--danger);background:#fef2f2;color:#7f1d1d}
  .block .x{position:absolute;top:2px;right:3px;font-size:12px;line-height:1;color:inherit;opacity:.55;
    cursor:pointer;padding:2px}
  .block .x:hover{opacity:1}
  .addrow{padding:10px 12px}

  .manual-form{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:16px;display:none;gap:10px;flex-wrap:wrap;align-items:end}
  .manual-form.open{display:flex}
  .manual-form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text-dim);font-weight:600}
  .manual-form input,.manual-form select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--border-strong);
    border-radius:6px;background:#fff}

  footer.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

  @media (max-width:700px){
    header.top h1{font-size:15px}
    main{padding:10px}
  }

  @media print{
    header.top,.pool,.manual-form,footer.actions,.daytabs,.addrow,.del,.x{display:none !important}
    body{padding:0;background:#fff}
    main{padding:0;max-width:none}
    .grid-wrap{border:none}
    .grid-scroll{overflow:visible}
    .grid-inner{min-width:0}
  }
</style>
</head>
<body>

<header class="top">
  <h1>🗓️ Rota Planner</h1>
  <div class="roster-status" id="rosterStatus"></div>
  <div class="spacer"></div>
  <button class="ghost" id="btnManual" title="Add a person by hand">+ Add person</button>
  <button id="btnPrint" title="Print current day">Print</button>
  <button class="primary" id="btnUpload">Upload PDF</button>
  <input type="file" id="fileInput" accept="application/pdf,.pdf">
</header>

<main>
  <div id="parseWarning"></div>
  <div id="manualForm" class="manual-form">
    <label>Name<input type="text" id="mName" placeholder="Jane Doe"></label>
    <label>Day
      <select id="mDay"></select>
    </label>
    <label>Start<input type="time" id="mStart" value="09:00"></label>
    <label>End<input type="time" id="mEnd" value="17:00"></label>
    <button class="primary" id="mAdd">Add</button>
    <button class="ghost" id="mCancel">Cancel</button>
  </div>

  <div id="app"></div>
</main>

<script src="vendor/pdf.min.js"></script>
<script src="rota-parser.js"></script>
<script src="rota-app.js"></script>
</body>
</html>
